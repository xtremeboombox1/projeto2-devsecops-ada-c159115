name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Instalação oficial e limpa do Conftest via script
      - name: Setup Conftest
        run: |
          LATEST=$(curl -s https://github.com | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget -q "https://github.com{LATEST}/conftest_${LATEST}_Linux_x86_64.tar.gz"
          tar -xzf "conftest_${LATEST}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      # Execução automática dos testes de unidade das suas políticas (.rego)
      - name: Run Unit Tests for Rego Policies
        run: |
          echo "=== Executando Testes Unitários de Políticas ==="
          conftest verify --policy policies/docker/
          conftest verify --policy policies/sbom/

      # GATE 1.1: Análise estática do Dockerfile Inicial (Vulnerável)
      - name: Validate Original Dockerfile (Expected to Fail)
        continue-on-error: true # Permite que o pipeline continue para mostrar a melhoria
        run: |
          echo "=== [LABORATÓRIO] Analisando Dockerfile Original Vulnerável ==="
          if [ -f Dockerfile ]; then
            conftest test Dockerfile --policy policies/docker/
          else
            echo "Dockerfile original não encontrado."
          fi

      # GATE 1.2: Análise estática do Dockerfile.secure (Corrigido)
      - name: Validate Secure Dockerfile (Expected to Pass)
        run: |
          echo "=== [LABORATÓRIO] Analisando Dockerfile.secure Corrigido ==="
          if [ -f Dockerfile.secure ]; then
            conftest test Dockerfile.secure --policy policies/docker/
          else
            echo "ERRO CRÍTICO: Dockerfile.secure não foi encontrado na raiz!" && exit 1
          fi

      # PASSO INTERMEDIÁRIO: Instalação do Syft usando a URL oficial
      - name: Install Syft
        run: |
          curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin

      # PASSO 2.1: Geração do SBOM via Syft baseando-se no projeto atual
      - name: Generate Project SBOM via Syft
        run: |
          syft dir:. -o json=sbom.json

      # GATE 2: Validação de conformidade estrutural e de licenças do SBOM gerado
      - name: Validate SBOM Compliance Fields
        run: |
          conftest test sbom.json --policy policies/sbom/ --namespace sbom_policy

      # PASSO 2.2: Instalação do Trivy Vulnerability Scanner usando repositório oficial
      - name: Install Trivy
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://github.io | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://github.io $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.min.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy

      # PASSO 2.3: Escaneamento de vulnerabilidades diretamente no SBOM gerado pelo Syft
      - name: Scan SBOM for Real Vulnerabilities via Trivy
        continue-on-error: true
        run: |
          trivy sbom sbom.json --format table --severity HIGH,CRITICAL

      # Publicação da evidência acadêmica (Garante o artefato mesmo se houver falhas de compliance)
      - name: Archive Compliance SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliant-project-sbom
          path: sbom.json
          retention-days: 14
