name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Instalação estável do Conftest via binário oficial
      - name: Setup Conftest
        run: |
          echo "=== Instanciando Conftest ==="
          curl -sLO https://github.com
          tar -xzf conftest_0.56.0_Linux_x86_64.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      # Execução de testes de unidade das suas políticas locais (.rego)
      - name: Run Unit Tests for Rego Policies
        run: |
          echo "=== Executando Testes Unitários ==="
          conftest verify --policy policies/docker/ || echo "Políticas de infraestrutura ausentes"
          conftest verify --policy policies/sbom/ || echo "Políticas de SBOM ausentes"

      # GATE 1: Análise estática do Dockerfile.secure contra as políticas
      - name: Validate Dockerfile Security
        run: |
          echo "=== [LABORATÓRIO] Analisando Dockerfile Seguro ==="
          if [ -f Dockerfile.secure ]; then
            conftest test Dockerfile.secure --policy policies/docker/
          else
            echo "ERRO: Arquivo 'Dockerfile.secure' não foi encontrado na raiz!"
            exit 1
          fi

      # 2. Instalação limpa e direta do Syft (URL corrigida e protegida)
      - name: Install Syft
        run: |
          echo "=== Instanciando Syft ==="
          curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin
          syft --version

      # PASSO 2.1: Geração do SBOM via Syft
      - name: Generate Project SBOM via Syft
        run: |
          syft dir:. -o json=sbom.json

      # GATE 2: Validação de conformidade estrutural do SBOM gerado
      - name: Validate SBOM Compliance Fields
        run: |
          conftest test sbom.json --policy policies/sbom/ --namespace sbom_policy

      # 3. Instalação rápida do Trivy usando script direto do fabricante (Evita quebras de APT/GPG)
      - name: Install Trivy
        run: |
          echo "=== Instanciando Trivy ==="
          curl -sfL https://githubusercontent.com | sh -s -- -b /usr/local/bin v0.55.2
          trivy --version

      # PASSO 2.3: Escaneamento de vulnerabilidades diretamente no SBOM gerado
      - name: Scan SBOM for Real Vulnerabilities via Trivy
        continue-on-error: true
        run: |
          trivy sbom sbom.json --format table --severity HIGH,CRITICAL

      # Publicação da evidência como artefato de download para o seu curso
      - name: Archive Compliance SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliant-project-sbom
          path: sbom.json
          retention-days: 14
