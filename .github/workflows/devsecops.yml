name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Instalação limpa e direta do Conftest
      - name: Setup Conftest
        run: |
          echo "=== Instalando Conftest ==="
          curl -sLO https://github.com
          tar -xzf conftest_0.56.0_Linux_x86_64.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      # Execução dos testes de unidade das políticas (.rego)
      - name: Run Unit Tests for Rego Policies
        run: |
          echo "=== Executando Testes Unitários ==="
          conftest verify --policy policies/docker/
          conftest verify --policy policies/sbom/

      # GATE 1: Análise estática focada APENAS no Dockerfile Seguro (Deve passar!)
      - name: Validate Secure Dockerfile
        run: |
          echo "=== [LABORATÓRIO] Analisando Dockerfile.secure Corrigido ==="
          if [ -f Dockerfile.secure ]; then
            conftest test Dockerfile.secure --policy policies/docker/
          else
            echo "ERRO CRÍTICO: O arquivo 'Dockerfile.secure' não foi encontrado na raiz do repositório!"
            exit 1
          fi

      # PASSO INTERMEDIÁRIO: Instalação do Syft
      - name: Install Syft
        run: |
          echo "=== Instalando Syft ==="
          curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin

      # PASSO 2.1: Geração do SBOM via Syft
      - name: Generate Project SBOM via Syft
        run: |
          syft dir:. -o json=sbom.json

      # GATE 2: Validação de conformidade estrutural e de licenças do SBOM
      - name: Validate SBOM Compliance Fields
        run: |
          conftest test sbom.json --policy policies/sbom/ --namespace sbom_policy

      # PASSO 2.2: Instalação direta e rápida do Trivy
      - name: Install Trivy
        run: |
          echo "=== Instalando Trivy ==="
          curl -sfL https://githubusercontent.com | sh -s -- -b /usr/local/bin v0.55.2

      # PASSO 2.3: Escaneamento de vulnerabilidades no SBOM gerado
      - name: Scan SBOM for Real Vulnerabilities via Trivy
        continue-on-error: true
        run: |
          trivy sbom sbom.json --format table --severity HIGH,CRITICAL

      # Publicação das evidências acadêmicas como artefato de download
      - name: Archive Compliance SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliant-project-sbom
          path: sbom.json
          retention-days: 14
