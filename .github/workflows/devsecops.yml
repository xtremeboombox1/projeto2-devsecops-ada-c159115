name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Permissões mínimas. id-token é obrigatório para o Cosign keyless (OIDC -> Fulcio)
permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Conftest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${LATEST}/conftest_${LATEST}_Linux_x86_64.tar.gz"
          tar -xzf "conftest_${LATEST}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Run Unit Tests for Rego Policies
        run: |
          conftest verify --policy policies/docker/ || echo "Sem testes locais ou políticas inconsistentes"
          conftest verify --policy policies/sbom/ || echo "Sem testes locais ou políticas inconsistentes"

      # GATE 1: Análise estática do Dockerfile contra as políticas de infraestrutura
      - name: Validate Dockerfile Security
        run: |
          if [ -f Dockerfile ]; then
            conftest test Dockerfile --policy policies/docker/
          else
            echo "Dockerfile não encontrado na raiz. Pulando validação."
          fi

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft version

      - name: Build Docker image
        run: docker build -t lab-app:ci .

      - name: Generate Project SBOM via Syft
        run: syft lab-app:ci -o syft-json=sbom.json -o cyclonedx-json=sbom-cdx.json

      - name: Debug licenses
        run: |
          jq '.artifacts[] | select(.type=="python") | {name, version, licenses}' sbom.json
          docker run --rm --entrypoint sh lab-app:ci -c "pip show jinja2 | grep -i license"

      # GATE 2
      - name: Validate SBOM Compliance Fields
        run: |
          conftest test sbom.json --policy policies/sbom/ --namespace sbom_policy

      - name: Install Trivy
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy

      - name: Scan SBOM for Real Vulnerabilities via Trivy
        continue-on-error: true
        run: |
          trivy sbom sbom-cdx.json --format table --severity HIGH,CRITICAL --skip-version-check

      # GATE 3 - CADEIA: assinatura keyless com Cosign

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem para o GHCR
        if: github.event_name != 'pull_request'
        id: push
        run: |
          # O nome da imagem precisa estar em minúsculas
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          docker tag lab-app:ci "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          # Referência imutável (por digest) - é ela que será assinada
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: ${REF}"

      - name: Assinar imagem com Cosign (keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Atestar SBOM CycloneDX na imagem (attestation)
        if: github.event_name != 'pull_request'
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom-cdx.json \
            "${{ steps.push.outputs.ref }}"

      - name: Verificar assinatura e attestation (imagem legítima)
        if: github.event_name != 'pull_request'
        run: |
          IDENTITY_REGEX="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/devsecops\.yml@refs/heads/.+$"
          ISSUER="https://token.actions.githubusercontent.com"
          REF="${{ steps.push.outputs.ref }}"

          {
            echo "=== VERIFICAÇÃO DA IMAGEM LEGÍTIMA ==="
            echo "Imagem: ${REF}"
            cosign verify \
              --certificate-identity-regexp "${IDENTITY_REGEX}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${REF}"
            echo
            echo "=== VERIFICAÇÃO DA ATTESTATION DO SBOM ==="
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity-regexp "${IDENTITY_REGEX}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${REF}" > /dev/null && echo "Attestation CycloneDX válida."
          } 2>&1 | tee cosign-evidence.txt
          # pipefail está ativo no shell do GitHub Actions, então falha aqui quebra o job

      # Cenário de ataque (Aula 6): imagem adulterada / tag hijack.
      # O "atacante" cria uma imagem derivada da legítima com um backdoor e a publica.
      # O digest muda, então não existe assinatura válida para ela.
      - name: Simular imagem adulterada e provar que a verificação falha
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.push.outputs.image }}"
          LEGIT_REF="${{ steps.push.outputs.ref }}"
          TAMPERED_TAG="${IMAGE}:${GITHUB_SHA}-tampered"
          IDENTITY_REGEX="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/devsecops\.yml@refs/heads/.+$"
          ISSUER="https://token.actions.githubusercontent.com"

          mkdir -p tamper
          printf 'FROM %s\nUSER root\nRUN echo "backdoor" > /tmp/backdoor.txt\n' "${LEGIT_REF}" > tamper/Dockerfile
          docker build -t "${TAMPERED_TAG}" tamper/
          docker push "${TAMPERED_TAG}"
          TAMPERED_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "${TAMPERED_TAG}")

          {
            echo
            echo "=== VERIFICAÇÃO DA IMAGEM ADULTERADA (esperado: FALHAR) ==="
            echo "Imagem: ${TAMPERED_REF}"
          } >> cosign-evidence.txt

          if cosign verify \
              --certificate-identity-regexp "${IDENTITY_REGEX}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${TAMPERED_REF}" >> cosign-evidence.txt 2>&1; then
            echo "::error::A imagem adulterada passou na verificação. Isso não deveria acontecer."
            exit 1
          else
            echo "RESULTADO: adulteração detectada, imagem sem assinatura válida." | tee -a cosign-evidence.txt
          fi

      # GATE 4 Compliance

      - name: Archive Compliance SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliant-project-sbom
          path: |
            sbom.json
            sbom-cdx.json
            cosign-evidence.txt
          if-no-files-found: ignore
          retention-days: 14