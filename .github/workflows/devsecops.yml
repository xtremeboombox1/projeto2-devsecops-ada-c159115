name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Instalação do Conftest via binário oficial
      - name: Setup Conftest
        run: |
          echo "=== Instanciando Conftest ==="
          CONFTEST_VERSION=0.56.0
          curl -sSfLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
          rm -f "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          conftest --version

      # Testes de unidade das políticas locais (.rego)
      - name: Run Unit Tests for Rego Policies
        run: |
          echo "=== Executando Testes Unitários ==="
          for dir in policies/docker policies/sbom; do
            if [ -d "$dir" ]; then
              conftest verify --policy "$dir"
            else
              echo "AVISO: diretório $dir ausente, pulando"
            fi
          done

      # GATE 1: Análise estática do Dockerfile.secure
      - name: Validate Dockerfile Security
        run: |
          echo "=== [LABORATÓRIO] Analisando Dockerfile Seguro ==="
          if [ -f Dockerfile.secure ]; then
            conftest test Dockerfile.secure --policy policies/docker/
          else
            echo "ERRO: Arquivo 'Dockerfile.secure' não foi encontrado na raiz!"
            exit 1
          fi

      # 2. Instalação do Syft
      - name: Install Syft
        run: |
          echo "=== Instanciando Syft ==="
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft --version

      # PASSO 2.1: Geração do SBOM
      - name: Generate Project SBOM via Syft
        run: |
          syft dir:. -o json=sbom.json

      # GATE 2: Conformidade estrutural do SBOM
      - name: Validate SBOM Compliance Fields
        run: |
          conftest test sbom.json --policy policies/sbom/ --namespace sbom_policy

      # 3. Instalação do Trivy
      - name: Install Trivy
        run: |
          echo "=== Instanciando Trivy ==="
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.55.2
          trivy --version

      # PASSO 2.3: Escaneamento de vulnerabilidades no SBOM
      - name: Scan SBOM for Real Vulnerabilities via Trivy
        continue-on-error: true
        run: |
          trivy sbom sbom.json --format table --severity HIGH,CRITICAL

      # Publicação da evidência como artefato
      - name: Archive Compliance SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliant-project-sbom
          path: sbom.json
          retention-days: 14