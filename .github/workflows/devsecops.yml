name: DevSecOps Supply Chain Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # Permite que você ative manualmente pelo botão se precisar

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Instalação limpa e oficial do Conftest via repositório Debian do GitHub
      - name: Setup Conftest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f 4 | sed 's/v//')
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${LATEST}/conftest_${LATEST}_Linux_x86_64.tar.gz"
          tar -xzf "conftest_${LATEST}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      # Execução de testes unitários de todas as políticas do repositório (.rego)
      - name: Run Unit Tests for Rego Policies
        run: |
          conftest verify --policy policies/docker/ || echo "Sem testes locais ou políticas inconsistentes"
          conftest verify --policy policies/sbom/ || echo "Sem testes locais ou políticas inconsistentes"

      # GATE 1: Análise estática do Dockerfile contra as políticas de infraestrutura
      - name: Validate Dockerfile Security
        run: |
          if [ -f Dockerfile ]; then
            conftest test Dockerfile --policy policies/docker/
          else
            echo "Dockerfile não encontrado na raiz. Pulando validação."
          fi

      # PASSO INTERMEDIÁRIO: Instalação do Syft usando a URL oficial e correta
      - name: Install Syft
        run: |
          curl -sSfL https://githubusercontent.com | sh -s -- -b /usr/local/bin

      # PASSO 2.1: Geração do SBOM via Syft
      - name: Generate Project SBOM via Syft
        run: |
          syft dir:. -o json=sbom.json

      # GATE 2: Validação de conformidade estrutural e de licenças do SBOM gerado
      - name: Validate SBOM Compliance Fields
        run: |
          conftest test sbom.json --policy policies/sbom/ --namespace sbom_policy

      # PASSO 2.2: Instalação do Trivy Vulnerability Scanner usando repositório oficial
      - name: Install Trivy
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://github.io | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://github.io $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.min.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy

      # PASSO 2.3: Escaneamento de vulnerabilidades diretamente no SBOM gerado pelo Syft
      - name: Scan SBOM for Real Vulnerabilities via Trivy
        continue-on-error: true
        run: |
          trivy sbom sbom.json --format table --severity HIGH,CRITICAL

      # Publicação da evidência - O inventário SBOM validado é anexado como artefato da esteira
      - name: Archive Compliance SBOM Artifact
        if: always() # Modificado para 'always' para garantir que você baixe as evidências mesmo se houver falhas anteriores
        uses: actions/upload-artifact@v4
        with:
          name: compliant-project-sbom
          path: sbom.json
          retention-days: 14
